name: Compile All LaTeX Files to Archive

on:
  push:
    branches:
      - main

jobs:
  build_all_latex:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Step 1: Check out the repository
      - name: Set up Git repository
        uses: actions/checkout@v4

      # Step 2: Inject phone number from GitHub Secret (if configured)
      - name: Inject Secret Phone Number
        env:
          PHONE: ${{ secrets.PHONE || secrets.PHONE_NUMBER }}
        shell: python
        run: |
          import os
          import glob

          phone = os.environ.get("PHONE", "").strip()
          if phone:
              print("Secret PHONE detected. Injecting into .tex files...")
              for tex_path in glob.glob("**/*.tex", recursive=True):
                  with open(tex_path, "r", encoding="utf-8") as f:
                      content = f.read()
                  new_content = content.replace("+91-XXXXXXXXXX", phone)
                  if new_content != content:
                      with open(tex_path, "w", encoding="utf-8") as f:
                          f.write(new_content)
                      print(f"Injected secret phone into {tex_path}")
          else:
              print("No PHONE secret configured. Building with fallback placeholder.")

      # Step 3: Compile EVERY .tex file using the marketplace action
      - name: Compile All LaTeX files
        uses: xu-cheng/latex-action@v4
        with:
          root_file: "**/*.tex"
          glob_root_file: true

      # Step 4: Organize and rename PDFs using a robust Python script
      - name: Rename and Move PDFs
        env:
          AUTHOR_PREFIX: "Vinay-Ghate"
          RUN_NUMBER: ${{ github.run_number }}
        shell: python
        run: |
          import os
          import glob
          import shutil

          output_dir = "final_pdfs"
          os.makedirs(output_dir, exist_ok=True)

          author = os.environ["AUTHOR_PREFIX"]
          run_num = int(os.environ["RUN_NUMBER"])

          # The LaTeX action dumps compiled PDFs in the root directory.
          # We search for the original .tex files to find their folder names.
          tex_files = glob.glob("**/*.tex", recursive=True)

          for tex_path in tex_files:
              dir_name = os.path.dirname(tex_path)
              file_base = os.path.splitext(os.path.basename(tex_path))[0]
              
              # The compiled PDF will be sitting at the root level
              pdf_path = f"{file_base}.pdf"
              
              if not os.path.exists(pdf_path):
                  continue

              # If the original .tex was in a subfolder, grab that folder's name
              if dir_name and dir_name != ".":
                  folder_name = os.path.basename(dir_name)
                  custom_name = f"{author}-{folder_name}-{file_base}-v{run_num:02d}.pdf"
              else:
                  custom_name = f"{author}-{file_base}-v{run_num:02d}.pdf"

              target_path = os.path.join(output_dir, custom_name)
              print(f"Moving {pdf_path} (originally in {dir_name}) -> {target_path}")
              shutil.move(pdf_path, target_path)

      # Step 5: Push all raw PDFs to the permanent Archive Release
      - name: Upload All to Permanent Release Archive
        uses: softprops/action-gh-release@v2
        with:
          tag_name: pdf-archive
          name: "LaTeX PDF Build Archive"
          body: "This release contains all historical raw PDF builds compiled by GitHub Actions."
          draft: false
          prerelease: false
          files: final_pdfs/*.pdf
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Step 6: Print the download dashboard link
      - name: Generate Direct Download Link
        run: |
          echo "### 📄 All PDFs Uploaded to Archive!" >> $GITHUB_STEP_SUMMARY
          echo "Every \`.tex\` file in your repository has been compiled and saved." >> $GITHUB_STEP_SUMMARY
          echo "👉 **[View All Raw PDF Builds (Including Older Versions)](https://github.com/${{ github.repository }}/releases/tag/pdf-archive)**" >> $GITHUB_STEP_SUMMARY
